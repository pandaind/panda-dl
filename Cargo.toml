[package]
name = "panda-dl"
version = "1.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
libc = "0.2.189"
librqbit = "9.0.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4"] }
